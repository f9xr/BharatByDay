# ============================================================
# BharatByDay — site configuration
# ============================================================

title: "BharatByDay"
tagline: "One unique spot in India to explore, every single day."
author: "F9XR Editorial Team"
email: "tontufytservices@gmail.com"
description: "One unique spot in India to explore, every single day. BharatByDay uncovers offbeat India — hidden stepwells, forgotten valleys, and local culture that the guidebooks miss."
lang: en
timezone: Asia/Kolkata

# Live site URL — required for SEO (canonical URLs, sitemap, social shares).
url: "https://f9xr.github.io"
baseurl: "/BharatByDay" # Set to "" if the site lives at the root of a custom domain

# Brand / publisher (used in structured data & footer)
org_name: "F9XR"
org_url: "https://f9xr.github.io"
logo: "https://f9xr.github.io/logo.webp"
image: "https://f9xr.github.io/logo.webp"

# ------------------------------------------------------------------
# Social media profiles
# ------------------------------------------------------------------
github_username: "f9xr"
linkedin_username: "f9xrteam"
instagram_username: "f9xrteam"
youtube_username: "QuarterlyLIV"

social:
  name: F9XR
  links:
    - https://github.com/f9xr
    - https://linkedin.com/company/f9xrteam
    - https://instagram.com/f9xrteam
    - https://www.youtube.com/@QuarterlyLIV
    - mailto:tontufytservices@gmail.com

twitter:
  username: f9xr
  card: summary_large_image

# ------------------------------------------------------------------
# SEO (jekyll-seo-tag)
# ------------------------------------------------------------------
seo:
  title_separator: "·"

# ------------------------------------------------------------------
# Feeds — jekyll-feed writes atom.xml; feed.xml mirrors it
# ------------------------------------------------------------------
feed:
  path: atom.xml
  posts_limit: 20

#########################################################################################
######### Nothing below needs to be changed (unless you know what you're doing) #########
#########################################################################################
theme: "minima"

minima:
  date_format: "%b %-d, %Y"
  show_excerpts: true

kramdown:
  syntax_highlighter_opts:
    disable: true

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

titles_from_headings:
  strip_title: true
  collections: true

defaults:
  - scope:
      path: ""
      type: post
    values:
      author: "F9XR Editorial Team"
      tags: Other
