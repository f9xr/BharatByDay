title: "BharatByDay"
author: "F9XR Editorial Team"
description: "One unique spot in India to explore, every single day. Uncovering offbeat India." # This will show up in places like twitter, linkedin, etc, if you share your sites url as a post.

# Live site URL — required for SEO (canonical URLs, sitemap, social shares).
# Update to your custom domain before/at launch if you have one.
url: "https://f9xr.github.io"
baseurl: "/BharatByDay" # Set to "" if the site lives at the root of a custom domain

# Email / Social media user names used by the minima theme:
# All of these are optional and can be removed or commented out
#email: "example@mail.com"
#twitter_username: "twitteruser"
#github_username: "githubuser"
#linkedin_username: "linkedinuser"
#facebook_username: username
#flickr_username: username
#instagram_username: username
#pinterest_username: username
#youtube_username: username
#googleplus_username: +username

#########################################################################################
######### Nothing below needs to be changed (unless you know what you're doing) #########
#########################################################################################
theme: "minima"

rss: rss

kramdown:
  syntax_highlighter_opts:
    disable: true
    
plugins:
  - jekyll-feed
  - jekyll-sitemap

titles_from_headings:
  strip_title: true
  collections: true

defaults:
  - scope:
      path: ""
      type: post
    values:
      tags: Other
