---
layout: default
---
<article class="page-article">
  {%- if page.title -%}
  <header class="page-header">
    <h1 class="page-heading">{{ page.title | escape }}</h1>
    {%- if page.description -%}
    <p class="page-description">{{ page.description | escape }}</p>
    {%- endif -%}
  </header>
  {%- endif -%}
  <div class="page-body">
    {{ content }}
  </div>
</article>
