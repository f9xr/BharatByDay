<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "en" }}">

  {%- include head.html -%}

  <body>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

    <div id="reading-progress" role="presentation"></div>
    <button id="back-to-top" type="button" aria-label="Back to top" title="Back to top">&uarr;</button>
    <script src="{{ "/js/main.js" | relative_url }}"></script>

  </body>

</html>
