<!-- Site build date: {{ "now" | date: "%FT%T%z" }} -->
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d1117">
  <link rel="icon" type="image/jpeg" href="{{ "/faviconFlag.jpg" | relative_url }}">
  <link rel="apple-touch-icon" href="{{ "/faviconFlag.jpg" | relative_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ site.logo }}">

  <!-- Begin SEO -->
  {% seo %}
  <!-- End SEO -->

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="preconnect" href="https://fonts.cdnfonts.com">
  <link rel="preconnect" href="https://fonts.cdnfonts.com" crossorigin>
  <link href="https://fonts.cdnfonts.com/css/neue-haas-grotesk-text-pro" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/neue-haas-grotesk-display-pro" rel="stylesheet">

  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  <link rel="stylesheet" type="text/css" href="{{ "/css/override.css" | relative_url }}">

  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@1.31.0/dist/umd/lucide.min.js" defer></script>

  {% feed_meta %}
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }} — RSS Feed" href="{{ "/atom.xml" | relative_url }}">

  {% if jekyll.environment == 'production' and site.google_analytics -%}
  <!-- Begin Google Analytics -->
  {% include google-analytics.html %}
  <!-- End Google Analytics -->
  {%- endif %}

  <!-- Apply saved theme before paint to avoid a flash -->
  <script>
    (function(){try{var t=localStorage.getItem('bbd-theme');if(t==='light'){document.documentElement.setAttribute('data-theme','light');}}catch(e){}})();
  </script>

  <!-- Begin highlight.js support -->
  <link rel="stylesheet" href="{{ "/js/highlightjs/styles/github.css" | relative_url }}">
  <link rel="stylesheet" href="{{ "/js/highlightjs/styles/ssms.css" | relative_url }}" />

  <script type="text/javascript" src="{{ "/js/highlightjs/highlight.min.js" | relative_url }}"></script>

  <script type="text/javascript" src="{{ "/js/highlightjs/languages/plaintext.min.js" | relative_url }}"></script>
  <script type="text/javascript" src="{{ "/js/highlightjs/languages/powershell.min.js" | relative_url }}"></script>
  <script type="text/javascript" src="{{ "/js/highlightjs/languages/tsql.min.js" | relative_url }}"></script>

  <script type="text/javascript"> hljs.highlightAll(); </script>
  <!-- end highlight.js support -->

  <!-- Structured data: WebSite + SearchAction (Google Sitelinks Searchbox) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "{{ site.title | escape }}",
    "url": "{{ "/" | absolute_url }}",
    "description": "{{ site.description | escape }}",
    "inLanguage": "{{ site.lang }}",
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "{{ "/search/?q=" | absolute_url }}{search_term_string}"
      },
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- Structured data: Organization (E-E-A-T / Publisher) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "{{ site.org_name | escape }}",
    "url": "{{ site.org_url }}",
    "logo": "{{ site.logo }}",
    "email": "{{ site.email }}",
    "foundingDate": "2026",
    "sameAs": {{ site.social.links | jsonify }}
  }
  </script>
</head>
