<header class="site-header" role="banner">
  <div class="wrapper">
    <div class="site-header-inner">

      <a class="site-title" rel="author" href="{{ "/" | relative_url }}">
        <img class="site-logo" src="{{ site.logo }}" alt="{{ site.title | escape }} — logo" width="28" height="28" decoding="async">
        <span>{{ site.title | escape }}</span>
      </a>

      <form class="search-form" role="search" action="{{ "/search/" | relative_url }}" method="get">
        <input type="search" name="q" placeholder="Search hidden gems…" aria-label="Search posts">
        <button type="submit" aria-label="Search" title="Search">
          <i data-lucide="search"></i>
        </button>
      </form>

      <nav class="site-nav">
        <input type="checkbox" id="nav-trigger" class="nav-trigger" />
        <label for="nav-trigger">
          <span class="menu-icon">
            <i data-lucide="menu"></i>
          </span>
        </label>

        <div class="trigger">
          <a class="page-link" href="{{ "/" | relative_url }}">Home</a>
          <a class="page-link" href="{{ "/archive.html" | relative_url }}">Archive</a>
          <a class="page-link" href="{{ "/author/f9xr" | relative_url }}">Author</a>
          <a class="page-link" href="{{ "/atom.xml" | relative_url }}">RSS</a>
          <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle light and dark theme" title="Toggle theme">
            <i data-lucide="moon" class="theme-icon theme-icon-moon"></i>
            <i data-lucide="sun" class="theme-icon theme-icon-sun"></i>
          </button>
        </div>
      </nav>

    </div>
  </div>
</header>
